<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>📦 Pokebox</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <h1>📦 Pokebox</h1>

        <p>Pokémon Save Editor</p>

    </header>

    <section class="menu">

        <button id="btnTrainer">
            👤
            <span>Trainer</span>
        </button>

        <button id="btnMoney">
            💰
            <span>Money</span>
        </button>

        <button id="btnBag">
            🎒
            <span>Bag</span>
        </button>

        <button id="btnParty">
            🐉
            <span>Party</span>
        </button>

        <button id="btnBoxes">
            📦
            <span>Boxes</span>
        </button>

        <button id="btnVault">
            ☁️
            <span>Vault</span>
        </button>

    </section>

    <main class="card">

        <label class="upload">

            📂 Selecionar Save

            <input
                type="file"
                id="saveInput"
                accept=".sav">

        </label>

        <div id="status">

            <h2>Bem-vindo! 👋</h2>

            <p>

                Selecione um save para começar.

            </p>

        </div>

    </main>

    <script
        type="module"
        src="js/main.js">
    </script>

</body>

</html>
