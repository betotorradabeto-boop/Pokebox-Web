<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pokebox</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Cabeçalho -->

    <div class="top">

        <h1>📦 Pokebox</h1>

    </div>

    <!-- Menu -->

    <div class="menu">

        <button id="btnTrainer">
            👤<br>Trainer
        </button>

        <button id="btnMoney">
            💰<br>Money
        </button>

        <button id="btnBag">
            🎒<br>Bag
        </button>

        <button id="btnParty">
            🐉<br>Party
        </button>

        <button id="btnBoxes">
            📦<br>Boxes
        </button>

        <button id="btnVault">
            ☁️<br>Vault
        </button>

    </div>

    <!-- Conteúdo -->

    <div class="card">

        <input
            type="file"
            id="saveInput"
            accept=".sav">

        <div id="status">

            <h2>Bem-vindo! 👋</h2>

            <p>

                Selecione um save para começar.

            </p>

        </div>

    </div>

    <script type="module"
            src="js/main.js">
    </script>

</body>

</html>
